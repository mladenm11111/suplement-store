version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=suplement_store
      - DB_PORT=3306

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: suplement_store
    volumes:
      - ./database/suplement_store.sql:/docker-entrypoint-initdb.d/suplement_store.sql
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  db_data: